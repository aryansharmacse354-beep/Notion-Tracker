services:
  - type: web
    name: notion-tracker-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook_gateway:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STORAGE_MODE
        value: hybrid
      - key: WEBHOOK_SECRET
        value: super_secret_enterprise_notion_key_2026
      - key: PORT
        value: 10000
